<div class="upload-view" id="vista-upload">
    <div class="upload-area">
        <label class="dropzone" id="dropzone">
            <input type="file" id="archivo" accept=".json,application/json" aria-labelledby="dz-title" aria-describedby="req-text">
            <span class="selector-archivo">
                <svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 20V5M7 11l7-7 7 7M4 24h20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
                <span id="dz-title">Seleccionar JSON</span>
            </span>
            <span class="dz-hint">o arrástralo aquí</span>
        </label>
        <p class="req" id="req-text">JSON con nodos y aristas · Hasta 64 MiB</p>
        <p class="req" id="estado-carga" role="status"></p>
        <div class="alert" id="upload-error" role="alert" hidden>
            <span class="alert-icon" aria-hidden="true">!</span>
            <div>
                <p class="alert-title" id="error-titulo"></p>
                <p class="alerta-indicacion" id="error-indicacion"></p>
            </div>
        </div>
        <button type="button" class="btn-demo" id="btn-demo">Usar red de ejemplo</button>
    </div>
</div>
