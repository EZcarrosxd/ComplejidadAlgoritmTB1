<div class="loading-view" id="vista-loading" aria-busy="true" hidden>
    <div class="loading-inner">
        <h1 class="loading-title">Analizando la red</h1>
        <p class="pct" id="pct" aria-hidden="true">0%</p>
        <div class="progress" id="progreso" role="progressbar" aria-label="Progreso del análisis"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progreso-barra"></div>
            <div class="progress-sweep"></div>
        </div>
        <ol class="steps" id="pasos"></ol>
        <button type="button" class="btn-outline" id="btn-cancelar">Cancelar análisis</button>
    </div>
</div>
