<div class="metrics">
    <button type="button" class="metric" data-modo="mst" aria-pressed="false" style="--c: var(--lime)">
        <span class="metric-bar" aria-hidden="true"></span>
        <span class="metric-title"><span class="swatch" aria-hidden="true"></span>Menor costo</span>
        <span class="metric-value"><small>S/</small><span id="val-costo">0,00</span></span>
        <span class="metric-cta">Ver en el mapa</span>
    </button>
    <button type="button" class="metric" data-modo="flow" aria-pressed="false" style="--c: var(--amber)">
        <span class="metric-bar" aria-hidden="true"></span>
        <span class="metric-title"><span class="swatch" aria-hidden="true"></span>Capacidad</span>
        <span class="metric-value"><span id="val-flujo">0</span><small>A</small></span>
        <span class="metric-cta">Ver en el mapa</span>
    </button>
    <button type="button" class="metric" data-modo="fallas" aria-pressed="false" style="--c: var(--red)">
        <span class="metric-bar" aria-hidden="true"></span>
        <span class="metric-title"><span class="swatch" aria-hidden="true"></span>Puntos débiles</span>
        <span class="metric-value"><span id="val-criticos">0</span></span>
        <span class="metric-cta">Ver en el mapa</span>
    </button>
</div>
