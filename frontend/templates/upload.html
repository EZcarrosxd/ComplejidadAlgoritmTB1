<main class="upload-main">
    <form class="upload-form" id="upload-form" novalidate>
        <h2>Sube tu dataset</h2>
        <p class="form-lead">Elige el archivo con los nodos eléctricos y las líneas que los conectan.</p>

        <label class="dropzone" id="dropzone">
            <input type="file" id="dataset-file" class="sr-only" accept=".json,.csv">
            <span class="dz-icon">
                <svg class="icon icon-empty" aria-hidden="true"><use href="#icon-upload"/></svg>
                <svg class="icon icon-filled" aria-hidden="true"><use href="#icon-check"/></svg>
            </span>
            <span class="dz-text">
                <span class="dz-title" id="dz-title">Arrastra tu archivo aquí</span>
                <span class="dz-hint" id="dz-hint">o haz clic para elegirlo desde tu equipo</span>
            </span>
        </label>

        <p class="requirements">Acepta .json y .csv con al menos 1500 nodos eléctricos.</p>

        <button type="submit" class="btn btn-primary" id="btn-submit" disabled>
            <span class="spinner" aria-hidden="true"></span>
            <span id="btn-label">Analizar red</span>
        </button>

        <div class="alert" id="upload-error" role="alert" hidden>
            <svg class="icon" aria-hidden="true"><use href="#icon-alert"/></svg>
            <p id="upload-error-text"></p>
        </div>
    </form>
</main>
