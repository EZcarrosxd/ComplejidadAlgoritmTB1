<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Red Eléctrica</title>
    <style>
        /* Variables del sistema de espaciado y tipografía */
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-primary: #111827; 
            --text-secondary: #6b7280; 
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: var(--spacing-xl);
            display: flex;
            justify-content: center;
        }

        /* Contenedor centralizado y responsivo */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--spacing-lg);
            max-width: 1000px;
            width: 100%;
        }

        /* Componentes aislados (Function First) */
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: var(--spacing-lg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        /* Etiquetas secundarias con énfasis reducido */
        .card-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }

        /* Valores primarios con alto contraste y peso */
        .card-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .card-subtext {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Gestión del espaciado interno para listas de datos */
        .node-list {
            list-style: none;
            padding: 0;
            margin: var(--spacing-md) 0 0 0;
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }

        .node-tag {
            background-color: #e5e7eb;
            color: #374151;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Componente 1: Costo Mínimo -->
        <div class="card">
            <p class="card-label">Costo Mínimo de Instalación</p>
            <p class="card-value" id="val-costo">Cargando...</p>
            <p class="card-subtext">Calculado por algoritmo MST (Kruskal)</p>
        </div>

        <!-- Componente 2: Flujo Máximo -->
        <div class="card">
            <p class="card-label">Capacidad de Flujo Máximo</p>
            <p class="card-value" id="val-flujo">Cargando...</p>
            <p class="card-subtext" id="sub-flujo">Calculado por Ford-Fulkerson</p>
        </div>

        <!-- Componente 3: Tolerancia a Fallos -->
        <div class="card" style="grid-column: 1 / -1;">
            <p class="card-label">Nodos Críticos Detectados (Vulnerabilidad)</p>
            <p class="card-value" id="val-criticos-count">Cargando...</p>
            <ul class="node-list" id="list-criticos">
                <!-- Inserción dinámica del DOM -->
            </ul>
        </div>
    </div>

    <script>
        // Configuración de comunicación con la API (Back-end)
        const API_BASE_URL = 'http://localhost:5000/api';

        async function cargarDatosCosto() {
            try {
                const response = await fetch(`${API_BASE_URL}/optimization/mst`);
                const data = await response.json();
                document.getElementById('val-costo').textContent = `$${data.costo_minimo_instalacion.toLocaleString()}`;
            } catch (error) {
                document.getElementById('val-costo').textContent = 'Error de conexión';
            }
        }

        async function cargarDatosFlujo() {
            try {
                const response = await fetch(`${API_BASE_URL}/optimization/flow`);
                const data = await response.json();
                document.getElementById('val-flujo').textContent = `${data.flujo_maximo_red.toLocaleString()} MW`;
                document.getElementById('sub-flujo').textContent = `Conexión evaluada: ${data.origen_evaluado} → ${data.destino_evaluado}`;
            } catch (error) {
                document.getElementById('val-flujo').textContent = 'Error de conexión';
            }
        }

        async function cargarEstadoRed() {
            try {
                const response = await fetch(`${API_BASE_URL}/network-status`);
                const data = await response.json();
                
                const nodos = data.nodos_criticos || [];
                document.getElementById('val-criticos-count').textContent = `${nodos.length} subestaciones vulnerables`;
                
                const listaElement = document.getElementById('list-criticos');
                listaElement.innerHTML = ''; 
                
                nodos.forEach(nodo => {
                    const li = document.createElement('li');
                    li.className = 'node-tag';
                    li.textContent = nodo;
                    listaElement.appendChild(li);
                });
            } catch (error) {
                document.getElementById('val-criticos-count').textContent = 'Error de conexión';
            }
        }

        // Ejecución secuencial al cargar el documento
        document.addEventListener('DOMContentLoaded', () => {
            cargarDatosCosto();
            cargarDatosFlujo();
            cargarEstadoRed();
        });
    </script>
</body>
</html>
